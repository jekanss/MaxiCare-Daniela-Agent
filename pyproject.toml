[project]
name = "maxicare-daniela"
version = "0.1.0"
description = "Daniela — agente conversacional de MaxiCare (clínica dental, Puente Largo, Bogotá). Arquitectura en docs/agentes/plan-agentes.json."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    # `sqlalchemy` es un extra real del paquete: lo exige `persistencia.tipo_sesion =
    # SQLAlchemySession` del plan. Sin él, el import de
    # `agents.extensions.memory.sqlalchemy_session` falla en el arranque, no en una prueba.
    "httpx>=0.27",
    "openai-agents[sqlalchemy]>=0.22.1",
    # Driver de PostgreSQL para Neon (`restricciones.stack_obligatorio`).
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxicare_daniela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `neon` marca las pruebas que necesitan la base de verdad. Se saltan salvo que esté
# MAXICARE_PRUEBAS_NEON=1, para que `uv run pytest -q` siga corriendo sin internet en un par
# de segundos: una suite que necesita señal es una suite que se deja de correr.
markers = [
    "neon: necesita una conexión real a Neon (usa el esquema 'pruebas', no toca datos reales)",
]
