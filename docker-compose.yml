# Daniela en el VPS.
#
# Se apoya en lo que ya existe ahí y no lo duplica: el túnel de Cloudflare y Traefik viven
# en `/opt/sinpiloto` y ya enrutan `daniela.maxicarecol.com`. Este compose solo añade el
# contenedor que responde detrás de ese nombre.
#
#   docker compose up -d --build
#
# NO publica ningún puerto en el host a propósito. La única forma de llegar a Daniela es
# Cloudflare → túnel → Traefik → esta red interna. Un `ports:` aquí abriría una segunda
# puerta, en claro y sin el WAF de Cloudflare delante — y nadie se acordaría de que existe.

name: maxicare-daniela

services:
  daniela:
    build: .
    image: maxicare-daniela:local
    restart: unless-stopped

    # Los secretos entran por aquí (Neon, OpenAI, WhatsApp, Telegram) y no se escriben en
    # este archivo, que sí se versiona.
    env_file: .env

    environment:
      TZ: America/Bogota

    # Docker da 10 segundos por defecto entre el SIGTERM y el SIGKILL, y un turno de Daniela
    # necesita más: 20 s de ventana del búfer, más el modelo, más el retardo humano. Con los
    # 10 por defecto, TODO despliegue que pillara a alguien escribiendo le mataba el turno a
    # media frase -- y el mensaje quedaba sin respuesta y sin fallo anotado, porque un
    # proceso muerto no escribe su motivo. Pasó el 13/09/2026.
    #
    # Tiene que ser MAYOR que `runtime.SEGUNDOS_PARA_DRENAR` (75): si Docker mata antes de
    # que el servidor termine de esperar, la espera no sirve de nada.
    stop_grace_period: 120s

    # El techo de RAM del contenedor, y no es cosmético.
    #
    # Un archivo de WhatsApp se carga ENTERO en memoria y se re-serializa hacia Telegram: dos
    # copias por archivo, más una tercera del base64 si además va al modelo. Y el webhook
    # encola cada mensaje sin límite de concurrencia. `canales.TOPE_DESCARGA_MB` acota cada
    # archivo; esto acota la suma, que es lo que un atacante controla mandando varios a la vez.
    #
    # 1 GiB con holgura: el proceso en reposo anda muy por debajo, y el día que se acerque es
    # que está pasando algo que hay que mirar. Sin esto, el contenedor se come la RAM del VPS
    # y se lleva por delante a Traefik y al túnel -- es decir, el ataque a Daniela tumbaría
    # todo lo demás que hay en la máquina.
    mem_limit: 1g

    # Y el techo de procesos. Barato, y cierra la otra forma de agotar el host.
    pids_limit: 512

    labels:
      - traefik.enable=true
      - traefik.http.routers.daniela.rule=Host(`daniela.maxicarecol.com`)
      - traefik.http.routers.daniela.entrypoints=web
      - traefik.http.services.daniela.loadbalancer.server.port=8080

      # ---------------------------------------------------------------------------------
      # Los dos frenos del borde
      # ---------------------------------------------------------------------------------
      #
      # Traefik no tenía NINGÚN middleware: ni límite de tamaño de cuerpo, ni rate limit. La
      # app tampoco --`await request.body()` lee lo que venga-- ni uvicorn. O sea que el único
      # límite de tamaño en toda la cadena era el de Cloudflare, que es de 100 MB.
      #
      # `buffering`: un webhook de Meta son unos pocos KB. 2 MiB es cien veces lo que hace
      # falta y corta en seco cualquier cuerpo absurdo ANTES de que llegue a Python, que es
      # donde dejaría de ser gratis.
      - traefik.http.middlewares.daniela-cuerpo.buffering.maxRequestBodyBytes=2097152
      - traefik.http.middlewares.daniela-cuerpo.buffering.memRequestBodyBytes=2097152

      # `rateLimit`: peticiones por segundo por IP de origen, promediadas en un minuto.
      # Meta manda una petición por mensaje, así que 20/s con ráfagas de 50 no lo estorba ni
      # en la hora punta de una clínica -- y deja fuera el barrido de `/api/entrar`, que era
      # el endpoint caro y sin freno.
      #
      # OJO: esto cuenta por IP de ORIGEN, y detrás del túnel de Cloudflare todas las
      # peticiones llegan con la IP del proxy. Para que sirva de algo, Traefik tiene que estar
      # arrancado con `--entrypoints.web.forwardedHeaders.trustedIPs` apuntando al túnel, y
      # eso vive en `/opt/sinpiloto`, fuera de este repositorio. Mientras no esté, este
      # middleware protege del tráfico interno y poco más: el freno real para el exterior es
      # el de Cloudflare.
      - traefik.http.middlewares.daniela-ritmo.ratelimit.average=20
      - traefik.http.middlewares.daniela-ritmo.ratelimit.burst=50
      - traefik.http.middlewares.daniela-ritmo.ratelimit.period=1s

      - traefik.http.routers.daniela.middlewares=daniela-cuerpo,daniela-ritmo
      # Traefik solo manda tráfico a un contenedor sano: durante un despliegue, los webhooks
      # de Meta siguen yendo al anterior hasta que el nuevo responde `/salud`.
      - traefik.http.services.daniela.loadbalancer.healthcheck.path=/salud
      - traefik.http.services.daniela.loadbalancer.healthcheck.interval=15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks: [interna]

networks:
  # Creada por el compose de `/opt/sinpiloto`. `external: true` porque este archivo la usa
  # pero no la posee: si la declarara propia, `docker compose down` se llevaría por delante
  # la red de la que cuelgan Traefik y el túnel.
  interna:
    external: true
    name: maxicare_interna
